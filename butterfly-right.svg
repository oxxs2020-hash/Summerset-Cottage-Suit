<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="100%" height="100%" style="overflow: visible;">
  <defs>
    <!-- Rich Yellowish-Gold Gradients for Natural Wings -->
    <linearGradient id="yellowForeGlow_R" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="20%" stop-color="#FFF176"/>
      <stop offset="55%" stop-color="#FBC02D"/>
      <stop offset="85%" stop-color="#F57F17"/>
      <stop offset="100%" stop-color="#B78103"/>
    </linearGradient>

    <linearGradient id="yellowHindGlow_R" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="30%" stop-color="#FDD835"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <linearGradient id="bodyGrad_R" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D2A26"/>
      <stop offset="50%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#2D2A26"/>
    </linearGradient>

    <filter id="softGlow_R" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#F59E0B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#softGlow_R)" transform="translate(60, 50) rotate(8) scale(-1, 1) translate(-60, -50)">
    
    <!-- HINDWINGS (Layered Behind) -->
    <g class="hindwings">
      <!-- Left Hindwing Main Body -->
      <path d="M 58 52 C 50 62, 28 58, 22 72 C 18 80, 24 90, 36 90 C 44 90, 48 84, 52 86 C 53 92, 51 96, 50 99 C 52 98, 55 92, 55 86 C 58 78, 58 64, 58 52 Z"
            fill="url(#yellowHindGlow_R)" stroke="#1A1815" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Left Hindwing Black Scalloped Margin -->
      <path d="M 22 72 C 18 80, 24 90, 36 90 C 44 90, 48 84, 52 86 C 50 82, 44 80, 38 78 C 30 76, 24 74, 22 72 Z"
            fill="#1E1C1A"/>
      <!-- Blue and Orange Spots in Margin -->
      <circle cx="28" cy="84" r="1.5" fill="#3B82F6"/>
      <circle cx="34" cy="85" r="1.5" fill="#3B82F6"/>
      <circle cx="42" cy="84" r="1.4" fill="#F97316"/>
      <circle cx="27" cy="86" r="0.9" fill="#FFFFFF"/>
      <circle cx="33" cy="87" r="0.9" fill="#FFFFFF"/>

      <!-- Hindwing Radiating Veins -->
      <path d="M 58 54 Q 42 66 28 78" stroke="#1A1815" stroke-width="1.1" fill="none" opacity="0.85"/>
      <path d="M 58 54 Q 46 72 36 86" stroke="#1A1815" stroke-width="1.1" fill="none" opacity="0.85"/>
      <path d="M 58 54 Q 52 76 51 94" stroke="#1A1815" stroke-width="1.0" fill="none" opacity="0.85"/>
      <path d="M 42 66 Q 34 68 25 74" stroke="#1A1815" stroke-width="0.75" fill="none" opacity="0.75"/>

      <!-- Right Hindwing Main Body -->
      <path d="M 62 52 C 70 62, 92 58, 98 72 C 102 80, 96 90, 84 90 C 76 90, 72 84, 68 86 C 67 92, 69 96, 70 99 C 68 98, 65 92, 65 86 C 62 78, 62 64, 62 52 Z"
            fill="url(#yellowHindGlow_R)" stroke="#1A1815" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Right Hindwing Black Scalloped Margin -->
      <path d="M 98 72 C 102 80, 96 90, 84 90 C 76 90, 72 84, 68 86 C 70 82, 76 80, 82 78 C 90 76, 96 74, 98 72 Z"
            fill="#1E1C1A"/>
      <!-- Right Blue & Orange Spots -->
      <circle cx="92" cy="84" r="1.5" fill="#3B82F6"/>
      <circle cx="86" cy="85" r="1.5" fill="#3B82F6"/>
      <circle cx="78" cy="84" r="1.4" fill="#F97316"/>
      <circle cx="93" cy="86" r="0.9" fill="#FFFFFF"/>
      <circle cx="87" cy="87" r="0.9" fill="#FFFFFF"/>

      <!-- Right Hindwing Veins -->
      <path d="M 62 54 Q 78 66 92 78" stroke="#1A1815" stroke-width="1.1" fill="none" opacity="0.85"/>
      <path d="M 62 54 Q 74 72 84 86" stroke="#1A1815" stroke-width="1.1" fill="none" opacity="0.85"/>
      <path d="M 62 54 Q 68 76 69 94" stroke="#1A1815" stroke-width="1.0" fill="none" opacity="0.85"/>
      <path d="M 78 66 Q 86 68 95 74" stroke="#1A1815" stroke-width="0.75" fill="none" opacity="0.75"/>
    </g>

    <!-- FOREWINGS (Layered Front) -->
    <g class="forewings">
      <!-- Left Forewing Outer Wing Shape -->
      <path d="M 60 42 C 54 22, 28 4, 8 10 C 1 12, 0 20, 6 30 C 12 40, 24 54, 44 60 C 54 63, 58 52, 60 42 Z"
            fill="url(#yellowForeGlow_R)" stroke="#1A1815" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- Left Black Border and Tiger Stripes / Margins -->
      <path d="M 8 10 C 1 12, 0 20, 6 30 C 9 27, 15 20, 25 16 C 18 13, 12 11, 8 10 Z" fill="#1A1815"/>
      <path d="M 28 6 C 24 12, 23 18, 24 24" stroke="#1A1815" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 38 12 C 34 20, 34 28, 36 34" stroke="#1A1815" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <path d="M 48 20 C 45 28, 45 38, 47 44" stroke="#1A1815" stroke-width="2.4" stroke-linecap="round" fill="none"/>

      <!-- White/Yellow Lace Dots on Outer Edge -->
      <circle cx="5" cy="20" r="1.1" fill="#FFFDE7"/>
      <circle cx="8" cy="26" r="1.1" fill="#FFFDE7"/>
      <circle cx="12" cy="33" r="1.0" fill="#FFFDE7"/>
      <circle cx="18" cy="40" r="1.0" fill="#FFFDE7"/>
      <circle cx="26" cy="48" r="1.0" fill="#FFFDE7"/>

      <!-- Left Forewing Delicate Veining System -->
      <path d="M 60 42 Q 36 34 14 20" stroke="#1A1815" stroke-width="1.3" fill="none" opacity="0.9"/>
      <path d="M 60 42 Q 32 42 12 32" stroke="#1A1815" stroke-width="1.2" fill="none" opacity="0.9"/>
      <path d="M 60 42 Q 36 50 26 55" stroke="#1A1815" stroke-width="1.2" fill="none" opacity="0.9"/>
      <path d="M 36 34 Q 24 26 18 24" stroke="#1A1815" stroke-width="0.8" fill="none" opacity="0.8"/>
      <path d="M 32 42 Q 20 40 16 42" stroke="#1A1815" stroke-width="0.8" fill="none" opacity="0.8"/>

      <!-- Right Forewing Outer Wing Shape -->
      <path d="M 60 42 C 66 22, 92 4, 112 10 C 119 12, 120 20, 114 30 C 108 40, 96 54, 76 60 C 66 63, 62 52, 60 42 Z"
            fill="url(#yellowForeGlow_R)" stroke="#1A1815" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- Right Black Border and Tiger Stripes / Margins -->
      <path d="M 112 10 C 119 12, 120 20, 114 30 C 111 27, 105 20, 95 16 C 102 13, 108 11, 112 10 Z" fill="#1A1815"/>
      <path d="M 92 6 C 96 12, 97 18, 96 24" stroke="#1A1815" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 82 12 C 86 20, 86 28, 84 34" stroke="#1A1815" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <path d="M 72 20 C 75 28, 75 38, 73 44" stroke="#1A1815" stroke-width="2.4" stroke-linecap="round" fill="none"/>

      <!-- Right White/Yellow Lace Dots -->
      <circle cx="115" cy="20" r="1.1" fill="#FFFDE7"/>
      <circle cx="112" cy="26" r="1.1" fill="#FFFDE7"/>
      <circle cx="108" cy="33" r="1.0" fill="#FFFDE7"/>
      <circle cx="102" cy="40" r="1.0" fill="#FFFDE7"/>
      <circle cx="94" cy="48" r="1.0" fill="#FFFDE7"/>

      <!-- Right Forewing Delicate Veining System -->
      <path d="M 60 42 Q 84 34 106 20" stroke="#1A1815" stroke-width="1.3" fill="none" opacity="0.9"/>
      <path d="M 60 42 Q 88 42 108 32" stroke="#1A1815" stroke-width="1.2" fill="none" opacity="0.9"/>
      <path d="M 60 42 Q 84 50 94 55" stroke="#1A1815" stroke-width="1.2" fill="none" opacity="0.9"/>
      <path d="M 84 34 Q 96 26 102 24" stroke="#1A1815" stroke-width="0.8" fill="none" opacity="0.8"/>
      <path d="M 88 42 Q 100 40 104 42" stroke="#1A1815" stroke-width="0.8" fill="none" opacity="0.8"/>
    </g>

    <!-- REALISTIC BODY, EYES, THORAX & ANTENNAE -->
    <g class="butterfly-body">
      <!-- Antennae with Club Tips -->
      <path d="M 59 28 Q 51 14 41 6" stroke="#141210" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <ellipse cx="40.5" cy="5.5" rx="1.6" ry="1.2" fill="#141210" transform="rotate(-30 40.5 5.5)"/>
      <path d="M 61 28 Q 69 14 79 6" stroke="#141210" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <ellipse cx="79.5" cy="5.5" rx="1.6" ry="1.2" fill="#141210" transform="rotate(30 79.5 5.5)"/>

      <!-- Head & Golden Eyes -->
      <ellipse cx="60" cy="30" rx="3.4" ry="3.8" fill="url(#bodyGrad_R)"/>
      <circle cx="57.5" cy="28.8" r="1.1" fill="#F59E0B"/>
      <circle cx="62.5" cy="28.8" r="1.1" fill="#F59E0B"/>
      <circle cx="57.5" cy="28.8" r="0.4" fill="#FFFFFF"/>
      <circle cx="62.5" cy="28.8" r="0.4" fill="#FFFFFF"/>

      <!-- Thorax (Fuzzy with Golden Hair Accents) -->
      <ellipse cx="60" cy="42" rx="4.2" ry="8.5" fill="url(#bodyGrad_R)"/>
      <path d="M 57.5 38 Q 60 40 62.5 38" stroke="#F59E0B" stroke-width="1.0" fill="none" opacity="0.85"/>
      <path d="M 57.2 42 Q 60 44 62.8 42" stroke="#F59E0B" stroke-width="1.0" fill="none" opacity="0.85"/>
      <path d="M 57.5 46 Q 60 48 62.5 46" stroke="#F59E0B" stroke-width="1.0" fill="none" opacity="0.85"/>

      <!-- Abdomen with Natural Segment Rings -->
      <path d="M 57 50 Q 60 48 63 50 L 62.2 75 Q 60 80 57.8 75 Z" fill="url(#bodyGrad_R)"/>
      <line x1="57.3" y1="54" x2="62.7" y2="54" stroke="#D97706" stroke-width="0.8" opacity="0.85"/>
      <line x1="57.6" y1="58" x2="62.4" y2="58" stroke="#D97706" stroke-width="0.8" opacity="0.85"/>
      <line x1="57.9" y1="62" x2="62.1" y2="62" stroke="#D97706" stroke-width="0.8" opacity="0.85"/>
      <line x1="58.2" y1="66" x2="61.8" y2="66" stroke="#D97706" stroke-width="0.8" opacity="0.85"/>
      <line x1="58.5" y1="70" x2="61.5" y2="70" stroke="#D97706" stroke-width="0.8" opacity="0.85"/>
    </g>
  </g>
</svg>