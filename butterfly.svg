<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 85" width="100%" height="100%">
  <defs>
    <!-- Rich Yellowish-Gold Gradients -->
    <linearGradient id="bfGoldFore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="25%" stop-color="#FFD54F"/>
      <stop offset="65%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="bfGoldHind" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="35%" stop-color="#FBBF24"/>
      <stop offset="80%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="bfBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="50%" stop-color="#0F0F0F"/>
      <stop offset="100%" stop-color="#262626"/>
    </linearGradient>
    <filter id="bfShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#bfShadow)">
    <!-- LEFT WINGS -->
    <g class="wing-left">
      <!-- Left Forewing -->
      <path d="M 50 34 C 44 18, 24 4, 7 9 C 1 11, 0 17, 4 25 C 8 34, 18 45, 34 50 C 44 53, 48 44, 50 34 Z" 
            fill="url(#bfGoldFore)" stroke="#1A1815" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- Left Forewing Black Edge & White Lace Dots -->
      <path d="M 7 9 C 1 11, 0 17, 4 25 C 6 23, 11 17, 19 14 C 14 11, 9 10, 7 9 Z" fill="#1A1815"/>
      <circle cx="4.5" cy="17" r="0.9" fill="#FFFFFF"/>
      <circle cx="6.5" cy="21" r="0.9" fill="#FFFFFF"/>
      <circle cx="10.5" cy="13" r="1.1" fill="#FFFFFF"/>
      <!-- Left Forewing Veins -->
      <path d="M 50 34 Q 31 29 13 17" stroke="#1A1815" stroke-width="1.1" fill="none" opacity="0.85"/>
      <path d="M 50 34 Q 27 35 11 27" stroke="#1A1815" stroke-width="1" fill="none" opacity="0.85"/>
      <path d="M 50 34 Q 29 42 21 46" stroke="#1A1815" stroke-width="1" fill="none" opacity="0.85"/>
      <path d="M 31 29 Q 21 23 15 21" stroke="#1A1815" stroke-width="0.8" fill="none" opacity="0.75"/>
      <path d="M 27 35 Q 17 33 13 35" stroke="#1A1815" stroke-width="0.8" fill="none" opacity="0.75"/>

      <!-- Left Hindwing -->
      <path d="M 50 44 C 44 52, 21 50, 17 62 C 15 68, 21 76, 31 76 C 41 76, 48 62, 50 47 Z" 
            fill="url(#bfGoldHind)" stroke="#1A1815" stroke-width="1.6" stroke-linejoin="round"/>
      <!-- Left Hindwing Black Border -->
      <path d="M 17 62 C 15 68, 21 76, 31 76 C 29 72, 23 68, 20 63 Z" fill="#1A1815"/>
      <circle cx="20" cy="71" r="0.85" fill="#FFFFFF"/>
      <circle cx="25" cy="74" r="0.85" fill="#FFFFFF"/>
      <!-- Left Hindwing Veins -->
      <path d="M 50 47 Q 35 58 23 68" stroke="#1A1815" stroke-width="1" fill="none" opacity="0.85"/>
      <path d="M 50 47 Q 41 64 33 73" stroke="#1A1815" stroke-width="1" fill="none" opacity="0.85"/>
      <path d="M 35 58 Q 27 58 21 62" stroke="#1A1815" stroke-width="0.75" fill="none" opacity="0.75"/>
    </g>

    <!-- RIGHT WINGS -->
    <g class="wing-right">
      <!-- Right Forewing -->
      <path d="M 50 34 C 56 18, 76 4, 93 9 C 99 11, 100 17, 96 25 C 92 34, 82 45, 66 50 C 56 53, 52 44, 50 34 Z" 
            fill="url(#bfGoldFore)" stroke="#1A1815" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- Right Forewing Black Edge & White Lace Dots -->
      <path d="M 93 9 C 99 11, 100 17, 96 25 C 94 23, 89 17, 81 14 C 86 11, 91 10, 93 9 Z" fill="#1A1815"/>
      <circle cx="95.5" cy="17" r="0.9" fill="#FFFFFF"/>
      <circle cx="93.5" cy="21" r="0.9" fill="#FFFFFF"/>
      <circle cx="89.5" cy="13" r="1.1" fill="#FFFFFF"/>
      <!-- Right Forewing Veins -->
      <path d="M 50 34 Q 69 29 87 17" stroke="#1A1815" stroke-width="1.1" fill="none" opacity="0.85"/>
      <path d="M 50 34 Q 73 35 89 27" stroke="#1A1815" stroke-width="1" fill="none" opacity="0.85"/>
      <path d="M 50 34 Q 71 42 79 46" stroke="#1A1815" stroke-width="1" fill="none" opacity="0.85"/>
      <path d="M 69 29 Q 79 23 85 21" stroke="#1A1815" stroke-width="0.8" fill="none" opacity="0.75"/>
      <path d="M 73 35 Q 83 33 87 35" stroke="#1A1815" stroke-width="0.8" fill="none" opacity="0.75"/>

      <!-- Right Hindwing -->
      <path d="M 50 44 C 56 52, 79 50, 83 62 C 85 68, 79 76, 69 76 C 59 76, 52 62, 50 47 Z" 
            fill="url(#bfGoldHind)" stroke="#1A1815" stroke-width="1.6" stroke-linejoin="round"/>
      <!-- Right Hindwing Black Border -->
      <path d="M 83 62 C 85 68, 79 76, 69 76 C 71 72, 77 68, 80 63 Z" fill="#1A1815"/>
      <circle cx="80" cy="71" r="0.85" fill="#FFFFFF"/>
      <circle cx="75" cy="74" r="0.85" fill="#FFFFFF"/>
      <!-- Right Hindwing Veins -->
      <path d="M 50 47 Q 65 58 77 68" stroke="#1A1815" stroke-width="1" fill="none" opacity="0.85"/>
      <path d="M 50 47 Q 59 64 67 73" stroke="#1A1815" stroke-width="1" fill="none" opacity="0.85"/>
      <path d="M 65 58 Q 73 58 79 62" stroke="#1A1815" stroke-width="0.75" fill="none" opacity="0.75"/>
    </g>

    <!-- BUTTERFLY BODY & ANTENNAE -->
    <g class="butterfly-body">
      <!-- Antennae -->
      <path d="M 49 22 Q 43 11 35 5" stroke="#1A1815" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <circle cx="34.5" cy="4.5" r="1.3" fill="#1A1815"/>
      <path d="M 51 22 Q 57 11 65 5" stroke="#1A1815" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <circle cx="65.5" cy="4.5" r="1.3" fill="#1A1815"/>
      
      <!-- Head & Eyes -->
      <ellipse cx="50" cy="23.5" rx="3" ry="3.5" fill="url(#bfBody)"/>
      <circle cx="47.8" cy="22.5" r="0.9" fill="#F59E0B"/>
      <circle cx="52.2" cy="22.5" r="0.9" fill="#F59E0B"/>
      
      <!-- Thorax -->
      <ellipse cx="50" cy="34.5" rx="3.8" ry="7.5" fill="url(#bfBody)"/>
      <!-- Golden fur accents -->
      <path d="M 48 30.5 Q 50 32.5 52 30.5" stroke="#F59E0B" stroke-width="0.9" fill="none" opacity="0.8"/>
      <path d="M 48 34.5 Q 50 36.5 52 34.5" stroke="#F59E0B" stroke-width="0.9" fill="none" opacity="0.8"/>

      <!-- Abdomen with Segments -->
      <path d="M 47.2 42 Q 50 40 52.8 42 L 52.2 64 Q 50 69 47.8 64 Z" fill="url(#bfBody)"/>
      <line x1="47.6" y1="46" x2="52.4" y2="46" stroke="#D97706" stroke-width="0.7" opacity="0.85"/>
      <line x1="47.9" y1="50" x2="52.1" y2="50" stroke="#D97706" stroke-width="0.7" opacity="0.85"/>
      <line x1="48.2" y1="54" x2="51.8" y2="54" stroke="#D97706" stroke-width="0.7" opacity="0.85"/>
      <line x1="48.5" y1="58" x2="51.5" y2="58" stroke="#D97706" stroke-width="0.7" opacity="0.85"/>
    </g>
  </g>
</svg>